plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.altisss.cccdreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.altisss.cccdreader"
        minSdk 24          // NFC IsoDep ổn định từ API 24 trở lên
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        // JMRTD/BouncyCastle hay bị đụng file license/manifest khi đóng gói
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // --- Đọc chip MRTD (BAC, đọc DataGroups, đọc SOD) theo chuẩn ICAO 9303 ---
    // JMRTD: implement giao thức BAC/PACE, parse LDS (Logical Data Structure)
    // 0.7.18 là bản ổn định, được dùng rộng rãi (VD: app passport-reader mã nguồn mở của tananaev)
    implementation('org.jmrtd:jmrtd:0.7.18') {
        exclude group: 'org.bouncycastle'   // tránh đụng class với bcprov-jdk15to18 khai báo bên dưới
    }
    // SCUBA: lớp giao tiếp smart card, có android-nfc adapter để map IsoDep -> CardService
    implementation 'net.sf.scuba:scuba-sc-android:0.0.26'
    // Không cần khai báo scuba-smartcards riêng - kéo về tự động qua jmrtd/scuba-sc-android

    // BouncyCastle: cần để parse ASN.1/CMS (SOD) và certificate X.509 (DS Cert)
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.77'

    // --- Quét QR code mặt trước CCCD (ML Kit, chạy offline, không cần Google Play Services online) ---
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}